[project]
name = "voice-agent-learns-bot"
version = "0.1.0"
description = "A Pipecat voice bot (Gradium, Smart Turn, WebRTC) whose LLM learns from its own calls."
requires-python = ">=3.11"
dependencies = [
  "pipecat-ai[openai,runner,webrtc,gradium,silero]>=1.11,<2",
  "polyvoice[pipecat] @ git+https://github.com/polygramme/polyvoice",
  "python-dotenv>=1.0",
]
